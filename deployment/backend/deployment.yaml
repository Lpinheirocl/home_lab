apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: home-server-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: home-server-manager-backend
      containers:
        - name: backend
          image: ghcr.io/lpinheirocl/home-server-manager-backend:arm64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: home-server-manager-backend
          env:
            - name: HSM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: home-server-manager-postgres
                  key: database-url
          volumeMounts:
            - name: host-mnt
              mountPath: /host/mnt
              readOnly: true
              mountPropagation: HostToContainer
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: host-mnt
          hostPath:
            path: /mnt
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
