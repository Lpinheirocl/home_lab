apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-server-manager
  namespace: home-server-manager
spec:
  ingressClassName: traefik
  rules:
    - host: raspberrypi
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
