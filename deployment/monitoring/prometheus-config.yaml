apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: home-server-manager
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: node-exporter
        static_configs:
          - targets: [node-exporter.home-server-manager.svc.cluster.local:9100]
